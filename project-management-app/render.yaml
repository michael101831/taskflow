services:
  - type: web
    name: taskflow-api
    runtime: node
    plan: free
    rootDir: project-management-app/server
    buildCommand: npm install --include=dev --include=optional && npm install --no-save --include=optional @typescript/typescript-linux-x64@7.0.2 && npx prisma generate && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        value: taskflow-project-fb
      - key: CLIENT_ORIGIN
        value: https://taskflow-project-fb.web.app
